name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # monthly, to catch library drift
    # min hour day-of-month month day-of-week
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Colab's Python version
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pm.model_to_graphviz needs the graphviz binaries as well as the
      # Python package; environment.yml gets both from python-graphviz.
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Quick mode: a random subset of the data and fewer draws
      # (see subsample and load_idata_or_sample in utils.py).
      - name: Run tests
        env:
          SURVEYDATAPYMC_QUICK: "1"
        run: |
          make tests
