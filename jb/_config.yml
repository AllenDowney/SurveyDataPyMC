# Book settings
title: Survey Data with PyMC
author: Allen B. Downey and Alexander Fengler

execute:
  # the solution notebooks are committed with their outputs (sampling takes minutes)
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/SurveyDataPyMC
  branch: main

html:
  baseurl: https://allendowney.github.io/SurveyDataPyMC/
  use_repository_button: true
  # Page-view counter: one request per page view to greenteapress.com/gh.gif,
  # counted from the greenteapress.com access logs (GreenTeaPress scripts/log_report.py).
  # No cookies, no third party.
  extra_footer: |
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath

sphinx:
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_baseurl: https://allendowney.github.io/SurveyDataPyMC/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/SurveyDataPyMC/
    ogp_site_name: Survey Data with PyMC
    ogp_image: https://greenteapress.com/wp/wp-content/uploads/2021/04/think_bayes_2e_cover_small.jpg
    ogp_image_alt: Cover of Think Bayes by Allen B. Downey
    # the opening text is often boilerplate, so write meta descriptions per page instead
    ogp_enable_meta_description: false
